name: Docker Images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-images
  cancel-in-progress: false

env:
  REGISTRY: registry.cn-beijing.aliyuncs.com
  IMAGE: registry.cn-beijing.aliyuncs.com/witter/frp

jobs:
  release:
    name: Detect latest official release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.latest.outputs.version }}
    steps:
      - name: Read latest stable FRP release
        id: latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/fatedier/frp/releases/latest -o release.json
          version="$(jq -er '.tag_name | select(type == "string") | sub("^v"; "")' release.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected official release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest official FRP release: $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [frpc, frps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: frp-test:${{ matrix.target }}
          build-args: |
            FRP_VERSION=${{ needs.release.outputs.version }}
            TARGET=${{ matrix.target }}
          labels: org.opencontainers.image.version=${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Check binary and configuration
        env:
          TARGET: ${{ matrix.target }}
          FRP_VERSION: ${{ needs.release.outputs.version }}
        run: sh tests/smoke.sh "frp-test:$TARGET" "$TARGET" "$FRP_VERSION"

      - name: Build both architectures and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.target }}
            ${{ env.IMAGE }}:${{ matrix.target }}-${{ needs.release.outputs.version }}
          build-args: |
            FRP_VERSION=${{ needs.release.outputs.version }}
            TARGET=${{ matrix.target }}
          labels: org.opencontainers.image.version=${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: false
          sbom: false
